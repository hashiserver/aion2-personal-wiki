name: Daily AION2 source monitor
on:
  schedule:
    - cron: "17 22 * * *" # 07:17 JST
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: aion2-daily-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public sources
        run: python3 scripts/monitor_sources.py
      - name: Open review PR for observations
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: data/source_monitor.json
          commit-message: "chore: record daily source monitoring results"
          title: "chore: daily AION2 source observations"
          body: "Automated source-change observations. HTTP changes are NOT validated patch notes. Review region, date, primary official notice and game applicability before editing verified portal data. Errors preserve the previous digest."
          branch: automation/aion2-daily-monitor
          delete-branch: true
