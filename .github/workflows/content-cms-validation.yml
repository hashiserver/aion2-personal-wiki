name: Portal content validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build static site
        run: python build.py
      - name: Validate generated site
        run: python checks/check_site.py dist
      - name: Prevent UI changes in AI-CMS PRs
        if: ${{ startsWith(github.head_ref, 'cms/') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD | while IFS= read -r file; do
            case "$file" in
              data/portal.json|data/sources.json|data/events.json|data/updates.json|content/*.md|content/*/*.md)
                ;;
              *)
                echo "AI-CMS PR cannot modify: $file"
                exit 1
                ;;
            esac
          done
